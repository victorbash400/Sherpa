<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" fill="none">
  <title>Luminous Orbit macOS icon</title>
  <desc>A balanced cyan, green, and blue luminous ring on a transparent background.</desc>
  <defs>
    <linearGradient id="ring" x1="250" y1="228" x2="800" y2="790" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#78FFCF"/>
      <stop offset="0.18" stop-color="#83F8A7"/>
      <stop offset="0.43" stop-color="#7DCB75"/>
      <stop offset="0.65" stop-color="#A7D9D6"/>
      <stop offset="0.84" stop-color="#78BDE2"/>
      <stop offset="1" stop-color="#668DBB"/>
    </linearGradient>
    <linearGradient id="highlight" x1="282" y1="245" x2="746" y2="705" gradientUnits="userSpaceOnUse">
      <stop stop-color="#E8FFF8" stop-opacity="0.98"/>
      <stop offset="0.22" stop-color="#A6FFE0" stop-opacity="0.78"/>
      <stop offset="0.52" stop-color="#FFFFFF" stop-opacity="0.12"/>
      <stop offset="0.78" stop-color="#BFEFFF" stop-opacity="0.52"/>
      <stop offset="1" stop-color="#D8F5FF" stop-opacity="0.1"/>
    </linearGradient>
    <filter id="ambient" x="-30%" y="-30%" width="160%" height="160%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
  </defs>

  <!-- Wide atmospheric halo; the SVG canvas itself remains fully transparent. -->
  <circle cx="512" cy="512" r="337" stroke="url(#ring)" stroke-width="48" opacity="0.22" filter="url(#ambient)"/>
  <circle cx="512" cy="512" r="337" stroke="#8CD8CF" stroke-width="30" opacity="0.34" filter="url(#soft)"/>

  <!-- Crisp core, optically centered with generous Dock-safe padding. -->
  <circle cx="512" cy="512" r="337" stroke="url(#ring)" stroke-width="23"/>
  <circle cx="512" cy="512" r="337" stroke="url(#highlight)" stroke-width="6.5" opacity="0.9"/>

  <!-- Subtle lower inner bloom gives the ring the soft dimensional finish of the reference. -->
  <path d="M274 751a337 337 0 0 0 476 0" stroke="#C9E2DD" stroke-width="18" stroke-linecap="round" opacity="0.26" filter="url(#soft)"/>
</svg>
